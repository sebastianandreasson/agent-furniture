[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "querycad"
version = "0.1.0"
description = "Agent-friendly, parametric furniture design with CadQuery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery==2.8.0",
]

[project.scripts]
querycad = "querycad.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/querycad"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
